<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COLDZ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Same look as the server loading screen (winter-server: resources/[z]/z_loadscreen): black, thin COLDZ
       with a red pulse and blood drips, black cards with a thin line, dark-red accent. -->
  <div class="bg" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="titlebar" data-tauri-drag-region>
    <div class="titlebar__name" data-tauri-drag-region>COLDZ <span data-tauri-drag-region>LAUNCHER</span> <small id="version" data-tauri-drag-region></small></div>
    <div class="titlebar__tools">
      <select id="lang" aria-label="Language">
        <option value="ru">RU</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="pt-BR">PT-BR</option>
      </select>
      <button class="winbtn" id="btn-min" aria-label="Minimize" data-i18n-title="minimize">
        <svg viewBox="0 0 12 12"><path d="M2 6.5h8" /></svg>
      </button>
      <button class="winbtn" id="btn-max" aria-label="Maximize" data-i18n-title="maximize">
        <svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" /></svg>
      </button>
      <button class="winbtn winbtn--close" id="btn-close" aria-label="Close" data-i18n-title="close">
        <svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" /></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="hero">
      <h1 class="mark bleed" aria-label="COLDZ"><span style="--i:0">C</span><span class="drip" style="--i:1;--d:1.7s;--len:5.5">O</span><span style="--i:2">L</span><span class="drip" style="--i:3;--d:2.3s;--len:3.6">D</span><span style="--i:4">Z</span></h1>
      <p class="lead" data-i18n="lead"></p>

      <div class="status" id="status" data-state="checking">
        <div class="status__cell status__cell--state">
          <span class="dot"></span>
          <span id="status-text" data-i18n="checking"></span>
        </div>
        <div class="status__cell">
          <span class="status__label" data-i18n="players"></span>
          <span class="status__value"><b id="players">—</b> / <span id="max-players">48</span></span>
        </div>
        <div class="status__cell">
          <span class="status__label" data-i18n="ping"></span>
          <span class="status__value"><b id="ping">—</b> <span data-i18n="ms"></span></span>
        </div>
      </div>

      <!-- Ник на сервере (13.11): уходит серверу по «Играть» (src-tauri/src/nick.rs), пусто — ник из FiveM -->
      <div class="nick" id="nick-box">
        <label class="nick__label" for="nick" data-i18n="nick_label"></label>
        <input class="nick__input" id="nick" type="text" maxlength="40" autocomplete="off" spellcheck="false"
               data-i18n-placeholder="nick_placeholder">
        <p class="nick__hint" id="nick-hint"></p>
      </div>

      <button class="play" id="play" disabled>
        <span class="play__text" data-i18n="play"></span>
      </button>

      <p class="address" id="address">
        <span id="address-text"></span>
        <button class="address__copy" id="btn-copy" hidden data-i18n="copy"></button>
      </p>

      <div class="fivem" id="fivem" data-state="checking">
        <p class="fivem__text" id="fivem-text"></p>
        <div class="fivem__actions" id="fivem-actions" hidden>
          <button class="btn btn--accent" id="btn-download" data-i18n="download_fivem"></button>
          <button class="btn" id="btn-recheck" data-i18n="recheck"></button>
        </div>
        <!-- FiveM завис в фоне (13.11, ошибка «LinkProtocolIPC»): закрыть все процессы FiveM, src-tauri/src/running.rs -->
        <div class="fivem__actions" id="fivem-stuck" hidden>
          <button class="btn btn--accent" id="btn-close-fivem" data-i18n="close_fivem"></button>
        </div>
      </div>

      <div class="update" id="update" hidden>
        <span id="update-text"></span>
        <button class="btn btn--accent" id="btn-update" data-i18n="update_install"></button>
      </div>
    </section>

    <aside class="panel">
      <nav class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-news" data-tab="news" aria-selected="true" data-i18n="news"></button>
        <button class="tab" role="tab" id="tab-rules" data-tab="rules" aria-selected="false" data-i18n="rules"></button>
      </nav>
      <p class="panel__note" id="news-note" hidden></p>
      <div class="panel__body" id="news-list" role="tabpanel" aria-labelledby="tab-news"></div>
      <div class="panel__body" id="rules-list" role="tabpanel" aria-labelledby="tab-rules" hidden></div>
    </aside>
  </main>

  <footer class="footer">
    <nav class="socials" id="socials"></nav>
    <div class="legal">
      <p class="legal__disclaimer">COLDZ IS NOT APPROVED, SPONSORED, OR ENDORSED BY ROCKSTAR GAMES.</p>
      <p class="legal__contact"><span data-i18n="contact"></span>: <a href="#" id="email"></a></p>
    </div>
  </footer>

  <script src="i18n.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
