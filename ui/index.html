<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COLDZ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Same look as the server loading screen (winter-server: resources/[z]/z_loadscreen): black, thin COLDZ
       with a red pulse and blood drips, black cards with a thin line, dark-red accent. -->
  <div class="bg" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="titlebar" data-tauri-drag-region>
    <div class="titlebar__name" data-tauri-drag-region>COLDZ <span data-tauri-drag-region>LAUNCHER</span> <small id="version" data-tauri-drag-region></small></div>
    <div class="titlebar__tools">
      <select id="lang" aria-label="Language">
        <option value="ru">RU</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="pt-BR">PT-BR</option>
      </select>
      <!-- 0.5.0: настройки и помощь (отчёт для поддержки, трей) -->
      <button class="winbtn" id="btn-settings" aria-label="Settings" data-i18n-title="settings">
        <svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="1.7" /><path d="M6 1v1.6M6 9.4V11M1 6h1.6M9.4 6H11M2.5 2.5l1.1 1.1M8.4 8.4l1.1 1.1M2.5 9.5l1.1-1.1M8.4 3.6l1.1-1.1" /></svg>
      </button>
      <button class="winbtn" id="btn-min" aria-label="Minimize" data-i18n-title="minimize">
        <svg viewBox="0 0 12 12"><path d="M2 6.5h8" /></svg>
      </button>
      <button class="winbtn" id="btn-max" aria-label="Maximize" data-i18n-title="maximize">
        <svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" /></svg>
      </button>
      <button class="winbtn winbtn--close" id="btn-close" aria-label="Close" data-i18n-title="close">
        <svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" /></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="hero">
      <h1 class="mark bleed" aria-label="COLDZ"><span style="--i:0">C</span><span class="drip" style="--i:1;--d:1.7s;--len:5.5">O</span><span style="--i:2">L</span><span class="drip" style="--i:3;--d:2.3s;--len:3.6">D</span><span style="--i:4">Z</span></h1>
      <p class="lead" data-i18n="lead"></p>

      <div class="status" id="status" data-state="checking">
        <div class="status__cell status__cell--state">
          <span class="dot"></span>
          <span class="status__state">
            <span id="status-text" data-i18n="checking"></span>
            <!-- 0.3.5: маршрут к серверу (src-tauri/src/route.rs): «Подключение: основной сервер» / «резервный маршрут» -->
            <small class="status__route" id="route-text" hidden></small>
          </span>
        </div>
        <div class="status__cell">
          <span class="status__label" data-i18n="players"></span>
          <span class="status__value"><b id="players">—</b> / <span id="max-players">48</span></span>
        </div>
        <div class="status__cell">
          <span class="status__label" data-i18n="ping"></span>
          <span class="status__value"><b id="ping">—</b> <span data-i18n="ms"></span></span>
        </div>
      </div>

      <!-- Ник на сервере (13.11): уходит серверу по «Играть» (src-tauri/src/nick.rs), пусто — ник из FiveM -->
      <div class="nick" id="nick-box">
        <label class="nick__label" for="nick" data-i18n="nick_label"></label>
        <input class="nick__input" id="nick" type="text" maxlength="40" autocomplete="off" spellcheck="false"
               data-i18n-placeholder="nick_placeholder">
        <p class="nick__hint" id="nick-hint"></p>
      </div>

      <button class="play" id="play" disabled>
        <span class="play__text" data-i18n="play"></span>
      </button>

      <p class="address" id="address">
        <span id="address-text"></span>
        <button class="address__copy" id="btn-copy" hidden data-i18n="copy"></button>
        <!-- 15.11: связь с серверами FiveM (Cfx.re) и сервером COLDZ, src-tauri/src/netcheck.rs -->
        <button class="address__copy" id="btn-net" data-i18n="net_check"></button>
      </p>

      <div class="fivem" id="fivem" data-state="checking">
        <p class="fivem__text" id="fivem-text"></p>
        <div class="fivem__actions" id="fivem-actions" hidden>
          <button class="btn btn--accent" id="btn-download" data-i18n="download_fivem"></button>
          <!-- 0.3.2: FiveM стоит, а лаунчер его не нашёл: указать FiveM.exe самому (src-tauri/src/fivem.rs) -->
          <button class="btn" id="btn-pick-fivem" data-i18n="pick_fivem"></button>
          <button class="btn" id="btn-recheck" data-i18n="recheck"></button>
        </div>
        <!-- FiveM завис в фоне (13.11, ошибка «LinkProtocolIPC»): закрыть все процессы FiveM, src-tauri/src/running.rs -->
        <div class="fivem__actions" id="fivem-stuck" hidden>
          <button class="btn btn--accent" id="btn-close-fivem" data-i18n="close_fivem"></button>
        </div>
        <!-- 0.3.4: проверка связи (при запуске лаунчера, «Играть», «Повторить») нашла, без чего FiveM не запустится:
             строка вместо «FiveM установлен», «Играть» не блокируется. Ссылки, а не кнопки: вместе с плашкой
             обновления всё влезает в окно 1120×680 -->
        <p class="fivem__links" id="fivem-net" hidden>
          <button class="address__copy" id="btn-net-retry" data-i18n="net_retry"></button>
          <button class="address__copy" id="btn-net-details" data-i18n="net_details"></button>
        </p>
        <!-- 0.5.0: подсказка после вылета FiveM (src-tauri/src/support.rs): одна строка вместо «FiveM установлен» -->
        <p class="fivem__links" id="fivem-hint" hidden>
          <button class="address__copy" id="btn-hint-report" data-i18n="hint_report"></button>
          <button class="address__copy" id="btn-hint-hide" data-i18n="hint_hide"></button>
        </p>
      </div>

      <div class="update" id="update" hidden>
        <span id="update-text"></span>
        <button class="btn btn--accent" id="btn-update" data-i18n="update_install"></button>
      </div>
    </section>

    <aside class="panel">
      <nav class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-news" data-tab="news" aria-selected="true" data-i18n="news"></button>
        <button class="tab" role="tab" id="tab-rules" data-tab="rules" aria-selected="false" data-i18n="rules"></button>
      </nav>
      <p class="panel__note" id="news-note" hidden></p>
      <div class="panel__body" id="news-list" role="tabpanel" aria-labelledby="tab-news"></div>
      <div class="panel__body" id="rules-list" role="tabpanel" aria-labelledby="tab-rules" hidden></div>
    </aside>
  </main>

  <footer class="footer">
    <nav class="socials" id="socials"></nav>
    <div class="legal">
      <p class="legal__disclaimer">COLDZ IS NOT APPROVED, SPONSORED, OR ENDORSED BY ROCKSTAR GAMES.</p>
      <p class="legal__contact"><span data-i18n="contact"></span>: <a href="#" id="email"></a></p>
    </div>
  </footer>

  <!-- Проверка связи (15.11): по «Играть» и «Проверить связь» (с 0.3.4 ещё тихо при запуске лаунчера, «Подробнее»
       под «Играть»). Серверы FiveM (Cfx.re) и сервер COLDZ отдельно:
       игрок видит, чья это проблема (src-tauri/src/netcheck.rs, README 7б). Карточка поверх окна, а не под «Играть»:
       так она не сдвигает кнопки под значки соцсетей на окне 1120×680. -->
  <div class="dialog" id="net" hidden>
    <div class="dialog__card" role="dialog" aria-modal="true" aria-labelledby="net-title">
      <h2 class="dialog__title" id="net-title" data-i18n="net_title"></h2>
      <p class="dialog__text" id="net-text"></p>
      <ul class="netlist" id="net-list"></ul>
      <p class="dialog__hint" id="net-hint" hidden></p>
      <!-- 0.4.0: резервный маршрут входа в FiveM (src-tauri/src/signin.rs): кнопка видна, когда вход Rockstar не
           отвечает, а маршрут COLDZ отвечает; под ней одной строкой, что потребуются права администратора и файл hosts -->
      <p class="dialog__hint" id="net-signin-note" hidden data-i18n="net_signin_note"></p>
      <div class="dialog__actions">
        <button class="btn btn--accent" id="btn-net-signin" hidden></button>
        <button class="btn btn--accent" id="btn-net-play" hidden></button>
        <button class="btn" id="btn-net-recheck" data-i18n="net_retry"></button>
        <button class="btn" id="btn-net-close" data-i18n="close"></button>
      </div>
    </div>
  </div>

  <!-- 0.5.0: настройки и помощь -->
  <div class="dialog" id="settings" hidden>
    <div class="dialog__card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 class="dialog__title" id="settings-title" data-i18n="settings_title"></h2>
      <div class="settings__list" id="settings-list"></div>
      <div class="dialog__actions">
        <button class="btn" id="btn-report-open" data-i18n="report_open"></button>
        <button class="btn" id="btn-settings-close" data-i18n="close"></button>
      </div>
    </div>
  </div>

  <!-- 0.5.0: отчёт для поддержки (src-tauri/src/support.rs): сначала список файлов, потом zip на рабочем столе,
       ничего не отправляется -->
  <div class="dialog" id="report" hidden>
    <div class="dialog__card" role="dialog" aria-modal="true" aria-labelledby="report-title">
      <h2 class="dialog__title" id="report-title" data-i18n="report_title"></h2>
      <p class="dialog__text" id="report-text" data-i18n="report_text"></p>
      <ul class="netlist filelist" id="report-list"></ul>
      <p class="dialog__hint" id="report-dumps" hidden></p>
      <label class="check" id="report-dump-box" hidden>
        <input type="checkbox" id="report-dump">
        <span id="report-dump-text"></span>
      </label>
      <p class="dialog__hint" id="report-result" hidden></p>
      <div class="dialog__actions">
        <button class="btn btn--accent" id="btn-report-make" data-i18n="report_make"></button>
        <button class="btn" id="btn-report-close" data-i18n="close"></button>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
