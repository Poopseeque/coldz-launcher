[package]
name = "coldz-launcher"
version = "0.3.2"
description = "COLDZ launcher: starts FiveM and connects to the COLDZ server"
authors = ["COLDZ"]
edition = "2021"
publish = false

[lib]
name = "coldz_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same reqwest/rustls as tauri-plugin-updater uses, so the HTTP stack is compiled in only once.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["net", "time", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "io-util"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# FiveM already running? (running.rs: process list, visible windows, close stuck FiveM). 0.59 is already in the tree.
# 0.3.2 (fivem.rs): Desktop, Downloads and Start menu folders (UI_Shell, System_Com), the "Choose FiveM.exe" dialog
# (UI_Controls_Dialogs), shortcut paths in the ANSI code page (Globalization)
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_UI_Controls_Dialogs", "Win32_Globalization"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
