[package]
name = "coldz-launcher"
version = "0.5.9"
description = "COLDZ launcher: starts FiveM and connects to the COLDZ server"
authors = ["COLDZ"]
edition = "2021"
publish = false

[lib]
name = "coldz_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 0.5.0: tray-icon for «Сворачивать в трей» (window.rs)
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same reqwest/rustls as tauri-plugin-updater uses, so the HTTP stack is compiled in only once.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt", "io-util"] }
# 0.4.0 (tunnel.rs): the reserve route for the FiveM sign-in: TLS to our relay with a pinned certificate. Both are
# already in the tree through reqwest.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
ring = "0.17"
# 0.5.7 (tunnel.rs): TCP keepalive on the connection to the relay. Already in the tree through tokio.
socket2 = "0.6"
# 0.5.0: the signature of news.json (minisign, its own key). Both are already in the tree through the updater.
minisign-verify = "0.3"
base64 = "0.23"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "io-util"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# FiveM already running? (running.rs: process list, visible windows, close stuck FiveM). 0.59 is already in the tree.
# 0.3.2 (fivem.rs): Desktop, Downloads and Start menu folders (UI_Shell, System_Com), the "Choose FiveM.exe" dialog
# (UI_Controls_Dialogs), shortcut paths in the ANSI code page (Globalization)
# 0.5.7 (hosts.rs): the elevated copy that stays: events (Security), a hidden window (Graphics_Gdi, System_LibraryLoader),
# the system folder (System_SystemInformation)
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_UI_Controls_Dialogs", "Win32_Globalization", "Win32_Security_WinTrust", "Win32_Security_Cryptography"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
