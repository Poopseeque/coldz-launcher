[package]
name = "coldz-launcher"
version = "0.2.1"
description = "COLDZ launcher: starts FiveM and connects to the COLDZ server"
authors = ["COLDZ"]
edition = "2021"
publish = false

[lib]
name = "coldz_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same reqwest/rustls as tauri-plugin-updater uses, so the HTTP stack is compiled in only once.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["net", "time", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
