# COLDZ relay: tunnel for the FiveM sign-in (launcher 0.4.0, src-tauri/src/tunnel.rs). 18.11.2026.
# Included INSIDE the `stream { ... }` block of /etc/coldz/nginx/nginx.conf (coldz-relay-nginx, not the site nginx):
#     include /etc/coldz/nginx/tunnel.stream.conf;
#
# Outer hop, port 8443: TLS from the launcher. The certificate is self-signed (install_tunnel.sh makes it); the
# launcher trusts it by its SHA-256 from news.json (`signin.tunnels[].sha256`), nothing else connects knowingly.
# Inside that TLS the launcher sends the player's own connection byte for byte: FiveM's TLS handshake, which names
# the real host (SNI). The inner hop (127.0.0.1:8444) reads that name without decrypting anything (`ssl_preread`)
# and connects to the real host on 443, only for the names in the map below. Everything else goes to a closed port.
# The encryption between FiveM and Rockstar/Cfx.re stays end to end: this VPS sees only encrypted bytes.

server {
    listen 8443 ssl backlog=1024;
    ssl_certificate     /etc/coldz/tunnel/tunnel.crt;
    ssl_certificate_key /etc/coldz/tunnel/tunnel.key;
    ssl_protocols       TLSv1.3 TLSv1.2;
    ssl_session_cache   shared:coldz_tunnel:1m;
    proxy_pass          127.0.0.1:8444;
    proxy_connect_timeout 5s;
    proxy_timeout       15m;
}

# Which names the tunnel may carry: the FiveM sign-in (Rockstar) and the Cfx.re services FiveM needs. A player's
# program that names anything else gets nothing (127.0.0.1:9, nobody listens). `hostnames` makes the leading dot
# mean "this domain and every name under it".
map $ssl_preread_server_name $coldz_tunnel_upstream {
    hostnames;
    .rockstargames.com          $ssl_preread_server_name:443;
    rsg.sc                      $ssl_preread_server_name:443;
    .fivem.net                  $ssl_preread_server_name:443;
    .cfx.re                     $ssl_preread_server_name:443;
    .cfx-services.net           $ssl_preread_server_name:443;
    cfx-content.akamaized.net   $ssl_preread_server_name:443;
    default                     127.0.0.1:9;
}

server {
    listen 127.0.0.1:8444;
    ssl_preread on;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;
    proxy_pass $coldz_tunnel_upstream;
    proxy_connect_timeout 5s;
    proxy_timeout 15m;
}
